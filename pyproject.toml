[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synphen-cl"
version = "1.0.0"
description = "Synonymous variant phenotype prediction via label-tabular contrastive learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "torch>=2.1",
]

[tool.setuptools.packages.find]
include = ["synphen_cl*"]
